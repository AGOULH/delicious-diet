// يرتّب أنواع البروتين على أيام الأسبوع بحيث لا يتكرر نفس النوع يومين متتاليَين إلا إذا تعذّر ذلك رياضياً
function spreadTypes(counts) {
  const order = ['chicken','meat','fish','veg'];
  const remaining = {}; order.forEach(t => remaining[t] = counts[t] || 0);
  const total = order.reduce((s,t) => s + remaining[t], 0);
  const result = [];
  let prev = null;
  for (let i=0; i<total; i++) {
    let candidates = order.filter(t => remaining[t] > 0 && t !== prev);
    if (candidates.length === 0) candidates = order.filter(t => remaining[t] > 0);
    candidates.sort((a,b) => remaining[b] - remaining[a]);
    const pick = candidates[0];
    remaining[pick]--;
    result.push(pick);
    prev = pick;
  }
  return result;
}

function distribute(sub, meals, proteins) {
  const bank = meals.filter(m => Number(m.week)===1);
  const pool = t => bank.filter(m => m.slot==='lunch' && m.type===t);
  const q = proteins || {chicken:3,meat:2,fish:1,veg:1};
  const typeOrder = spreadTypes(q);
  const nextIdx = {chicken:0,meat:0,fish:0,veg:0};
  let lunches = typeOrder.map(t => {
    const p = pool(t);
    if (!p.length) return null;
    const m = p[nextIdx[t] % p.length];
    nextIdx[t]++;
    return m;
  }).filter(Boolean);
  const allLunch = bank.filter(m=>m.slot==='lunch');
  while(lunches.length<7 && allLunch.length) lunches.push(allLunch[lunches.length%allLunch.length]);
  lunches=lunches.slice(0,7);
  const bf=bank.filter(m=>m.slot==='breakfast');
  const dn=bank.filter(m=>m.slot==='dinner');
  const n=Number(sub.plan);
  return DAYS.map((_,i)=>{
    const day=[];
    if(n>=2 && bf.length) day.push(bf[i%bf.length].id);
    if(lunches[i]) day.push(lunches[i].id);
    if(n>=3 && dn.length) day.push(dn[i%dn.length].id);
    return day;
  });
}

function seedData() {
  const today=new Date();
  const meals=SEED_MEALS.slice();
  const subscribers=SEED_SUBS.slice();
  const specs=[
    {plan:'3',dur:24,offset:-18,paid:'paid'},{plan:'2',dur:24,offset:-21,paid:'paid'},
    {plan:'1',dur:6,offset:-3,paid:'unpaid'},{plan:'3',dur:24,offset:-8,paid:'paid'},
    {plan:'2',dur:6,offset:-2,paid:'unpaid'},{plan:'1',dur:24,offset:-12,paid:'partial'}
  ];
  const subscriptions=subscribers.map((s,i)=>{
    const sp=specs[i]; const start=addDays(today,sp.offset);
    return {id:'sub'+(i+1),subscriberId:s.id,plan:sp.plan,duration:sp.dur,
      start:iso(start),end:iso(addDays(start,sp.dur)),delivery:i%2===0,salad:i%3===0,paid:sp.paid,
      proteins:{chicken:3,meat:2,fish:1,veg:1},total:price(DEFAULT_PRICING,sp.plan,sp.dur,i%2===0,i%3===0)};
  });
  const plans={};
  subscribers.forEach((s,i)=>{plans[s.id]=distribute(subscriptions[i],meals,subscriptions[i].proteins);});
  return {subscribers,subscriptions,meals,plans,pricing:DEFAULT_PRICING,accounts:[],ownerPin:'1234',testimonials:[],promo:DEFAULT_PROMO};
}

function App(){
  const [screen,setScreen]=useState('home');
  const [tab,setTab]=useState('dash');
  const [role,setRole]=useState(null);
  const [pendingRole,setPendingRole]=useState('owner');
  const [pin,setPin]=useState('');
  const [loginError,setLoginError]=useState('');
  const [search,setSearch]=useState('');
  const [cycle,setCycle]=useState(1);
  const [chefDay,setChefDay]=useState(new Date().getDay());

  const [data,setData]=useState(()=>{
    try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.subscribers)return d;}catch(e){}
    return seedData();
  });
  const [sync,setSync]=useState('...');
  const dataRef=useRef(data);
  dataRef.current=data;

  // مزامنة لحظية مع Firestore
  useEffect(()=>{
    let unsub=null;
    const start=()=>{
      const fb=window.__fb;
      if(!fb){setSync('محلي');return;}
      const ref=fb.doc(fb.db,'sites',DOC_ID);
      unsub=fb.onSnapshot(ref,snap=>{
        if(snap.exists()){
          const d=snap.data();
          if(d&&Array.isArray(d.subscribers)){
            const next=fromCloud(d);
            setData(next);
            try{localStorage.setItem(KEY,JSON.stringify(next));}catch(e){}
          }
        }else{
          fb.setDoc(ref,toCloud(dataRef.current)).catch(e=>console.error(e));
        }
        setSync('سحابي');
      },err=>{console.error('[Firestore]',err);setSync('خطأ');});
    };
    if(window.__fb)start();
    else{
      window.addEventListener('fb-ready',start,{once:true});
      window.addEventListener('fb-failed',()=>setSync('محلي'),{once:true});
      setTimeout(()=>{if(!window.__fb)setSync('محلي');},8000);
    }
    return ()=>{if(unsub)unsub();};
  },[]);

  const persist=useCallback(patch=>{
    const next={...dataRef.current,...patch};
    setData(next);
    try{localStorage.setItem(KEY,JSON.stringify(next));}catch(e){}
    const fb=window.__fb;
    if(fb){
      fb.setDoc(fb.doc(fb.db,'sites',DOC_ID),toCloud(next))
        .catch(e=>{console.error('[Firestore] فشل الحفظ:',e);setSync('خطأ');});
    }
  },[]);

  const {subscribers,subscriptions,meals,plans}=data;
  const pricing=data.pricing||DEFAULT_PRICING;
  const accounts=data.accounts||[];
  const ownerPin=data.ownerPin||'1234';
  const testimonialsData=data.testimonials||[];
  const promo=data.promo||DEFAULT_PROMO;
  const todayIso=iso(new Date());
  const promoActive=!!(promo.enabled && Number(promo.percent)>0 && (!promo.start||todayIso>=promo.start) && (!promo.end||todayIso<=promo.end));
  const activePromoPercent=promoActive?Number(promo.percent)||0:0;
  const mealById=id=>meals.find(m=>m.id===id);
  const heroMeals=meals.filter(m=>m.image);
  const [heroIdx,setHeroIdx]=useState(0);
  useEffect(()=>{
    if(heroMeals.length<2)return;
    const t=setInterval(()=>setHeroIdx(i=>(i+1)%heroMeals.length),10000);
    return ()=>clearInterval(t);
  },[heroMeals.length]);
  const subOf=sid=>subscriptions.filter(s=>s.subscriberId===sid).sort((a,b)=>b.start.localeCompare(a.start))[0];
  const slotOrder={breakfast:0,lunch:1,dinner:2};
  const setDayMeal=(subscriberId,dayIndex,slot,mealId)=>{
    const current=(plans[subscriberId]||DAYS.map(()=>[])).map(day=>day.slice());
    while(current.length<7) current.push([]);
    const kept=current[dayIndex].filter(id=>{const m=mealById(id);return !m||m.slot!==slot;});
    if(mealId) kept.push(mealId);
    kept.sort((a,b)=>(slotOrder[(mealById(a)||{}).slot]??9)-(slotOrder[(mealById(b)||{}).slot]??9));
    current[dayIndex]=kept;
    persist({plans:{...plans,[subscriberId]:current}});
  };
  const swapDays=(subscriberId,i,j)=>{
    const current=(plans[subscriberId]||DAYS.map(()=>[])).map(day=>day.slice());
    if(!current[i]||!current[j])return;
    const tmp=current[i];current[i]=current[j];current[j]=tmp;
    persist({plans:{...plans,[subscriberId]:current}});
  };

                </tr>);})}</tbody>
            </table>
          </div>
          <div className="card" style={{padding:26,background:'var(--color-bg)'}}>
            <h3 style={{fontFamily:'var(--font-heading)',fontWeight:800,fontSize:22,color:'var(--green)',margin:'0 0 16px'}}>مستحقات غير مدفوعة</h3>
            {unpaid.map(s=>(
              <div key={s.id} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 0',borderBottom:'1px solid var(--color-divider)'}}>
                <div style={{flex:1}}><div style={{fontWeight:700,fontSize:'14.5px'}}>{nameOf(s.subscriberId)}</div><div style={{fontSize:'12.5px',color:'var(--color-accent-600)'}}>{PLANS[s.plan].label}</div></div>
                <div style={{fontFamily:'var(--font-heading)',fontWeight:800,fontSize:19,color:'#8A2F1E'}}>{s.total} ر.س</div>
                <button className="btn-green" style={{fontSize:'12.5px',padding:'6px 12px'}} onClick={()=>persist({subscriptions:subscriptions.map(x=>x.id===s.id?{...x,paid:'paid'}:x)})}>تم الدفع</button>
              </div>
            ))}
          </div>
        </div>
      </>}

      {/* Subscribers */}
      {tab==='subs' && <div className="card" style={{padding:26,background:'var(--color-bg)'}}>
        <div style={{display:'flex',gap:14,alignItems:'center',marginBottom:20,flexWrap:'wrap'}}>
          <h3 style={{fontFamily:'var(--font-heading)',fontWeight:800,fontSize:24,color:'var(--green)'}}>المشتركون</h3>
          <input className="input" style={{maxWidth:280,marginInlineStart:'auto'}} placeholder="بحث بالاسم أو الجوال" value={search} onChange={e=>setSearch(e.target.value)}/>
          <button className="btn-green" style={{fontSize:'13.5px',padding:'10px 18px'}} onClick={()=>setTab('new')}>+ مشترك جديد</button>
          <button className="btn-outline" style={{fontSize:'13.5px',padding:'10px 18px'}} onClick={()=>{if(window.confirm('سيُعاد توزيع وجبات كل المشتركين ('+subscribers.length+') تلقائياً بحيث لا يتكرر نفس نوع البروتين يومين متتاليَين. أي تعديل يدوي سابق سيُستبدل. متابعة؟'))redistributeAll();}}>توزيع تلقائي لجميع المشتركين</button>
          {role==='owner' && <button className="btn-danger" style={{fontSize:'13.5px',padding:'10px 18px'}} onClick={deleteAllSubscribers}>حذف جميع المشتركين</button>}
        </div>
        <div style={{overflowX:'auto'}}>
        <table className="table"><thead><tr><th>الاسم</th><th>الهوية</th><th>الجوال</th><th>الاشتراك</th><th>البداية</th><th>الانتهاء</th><th>المتبقي</th><th>الدفع</th>{role==='owner' && <th>خصم %</th>}<th>إجراءات</th></tr></thead>
          <tbody>{filtered.map(sb=>{const s=subOf(sb.id);const d=s?daysLeft(s.end):0;return(
            <tr key={sb.id}>
              <td style={{fontWeight:700}}>{sb.name}</td><td dir="ltr">{sb.nid}</td><td dir="ltr">{sb.phone}</td>
              <td>{s?PLANS[s.plan].label+' · '+s.duration+' يوم':'—'}</td><td dir="ltr">{s?fmt(s.start):'—'}</td><td dir="ltr">{s?fmt(s.end):'—'}</td>
              <td>{s?<span style={pill(d)}>{d>0?d+' يوم':'منتهي'}</span>:'—'}</td>
              <td>{s?<button onClick={()=>persist({subscriptions:subscriptions.map(x=>x.id===s.id?{...x,paid:s.paid==='paid'?'unpaid':s.paid==='unpaid'?'partial':'paid'}:x)})} style={{cursor:'pointer',fontFamily:'var(--font-body)',fontSize:'12.5px',fontWeight:700,padding:'5px 12px',border:'1px solid '+(s.paid==='paid'?'#1FA855':s.paid==='partial'?'#B99B54':'#C9714F'),background:'transparent',color:s.paid==='paid'?'#178A45':s.paid==='partial'?'#7C6634':'#8A2F1E'}}>{s.paid==='paid'?'مدفوع':s.paid==='partial'?'جزئي':'غير مدفوع'}</button>:'—'}</td>
              {role==='owner' && <td><input type="number" min={0} max={100} defaultValue={sb.discount||0} onBlur={e=>setSubscriberDiscount(sb.id,e.target.value)} className="input" style={{width:64,padding:'6px 8px',fontSize:'12.5px'}} dir="ltr"/></td>}
              <td><div style={{display:'flex',gap:6}}>
                <button className="btn-outline" style={{fontSize:'12.5px',padding:'5px 9px'}} onClick={()=>{setScreen('portal');setPortalId(sb.id);setPortalQuery(sb.phone);}}>الوجبات</button>
                <button className="btn-danger" style={{fontSize:'12.5px',padding:'5px 9px'}} onClick={()=>{if(window.confirm('حذف '+sb.name+'؟')){const p={...plans};delete p[sb.id];persist({subscribers:subscribers.filter(x=>x.id!==sb.id),subscriptions:subscriptions.filter(x=>x.subscriberId!==sb.id),plans:p});}}}>حذف</button>
              </div></td>
            </tr>);})}</tbody>
        </table>
        </div>
        {filtered.length===0 && <div style={{padding:38,textAlign:'center',color:'var(--color-accent-600)'}}>لا توجد نتائج</div>}
      </div>}

      {/* New Subscription */}
      {tab==='new' && <div className="grid-2" style={{display:'grid',gridTemplateColumns:'1.25fr .75fr',gap:24,alignItems:'start'}}>
        <div className="card" style={{padding:30,background:'var(--color-bg)'}}>
          <h3 style={{fontFamily:'var(--font-heading)',fontWeight:800,fontSize:24,color:'var(--green)',margin:'0 0 22px'}}>إضافة مشترك / اشتراك جديد</h3>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:16}}>
            <div className="field"><label>رقم الهوية</label><input className="input" dir="ltr" maxLength={10} value={form.nid} onChange={e=>{setForm({...form,nid:e.target.value});setFormError('');}}/></div>
            <div className="field"><label>رقم الجوال</label><input className="input" dir="ltr" maxLength={10} value={form.phone} onChange={e=>{setForm({...form,phone:e.target.value});setFormError('');}}/></div>
            <div className="field"><label>الاسم</label><input className="input" value={form.name} onChange={e=>{setForm({...form,name:e.target.value});setFormError('');}}/></div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginTop:8}}>
            <div className="field"><label>نوع الاشتراك</label><select className="input" value={form.plan} onChange={e=>setForm({...form,plan:e.target.value})}><option value="3">ثلاث وجبات</option><option value="2">وجبتين</option><option value="1">وجبة واحدة</option></select></div>
            <div className="field"><label>المدة</label><select className="input" value={form.duration} onChange={e=>setForm({...form,duration:e.target.value})}><option value="24">٢٤ يوم</option><option value="6">٦ أيام</option><option value="custom">مدة مخصصة</option></select></div>
            {form.duration==='custom' && <div className="field"><label>عدد الأيام</label><input className="input" type="number" min={1} value={form.customDays} onChange={e=>setForm({...form,customDays:e.target.value})} placeholder="مثال: يومان أو ٥ أيام"/></div>}
            <div className="field"><label>تاريخ البداية</label><input className="input" type="date" dir="ltr" value={form.start} onChange={e=>setForm({...form,start:e.target.value})}/></div>
            <div className="field"><label>حالة الدفع</label><select className="input" value={form.paid} onChange={e=>setForm({...form,paid:e.target.value})}><option value="paid">تم الدفع</option><option value="unpaid">لم يُدفع</option><option value="partial">دفعة جزئية</option></select></div>
          </div>
          <div style={{marginTop:18,paddingTop:18,borderTop:'1px solid var(--color-divider)'}}>
            <div style={{fontWeight:700,fontSize:'14.5px',color:'var(--green)',marginBottom:12}}>توزيع البروتينات في الأسبوع (٧ أيام)</div>
            <div className="grid-4" style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14}}>
              <div className="field"><label>دجاج</label><input className="input" type="number" min={0} max={7} value={form.chicken} onChange={e=>setForm({...form,chicken:Math.max(0,Math.min(7,Number(e.target.value)||0))})}/></div>
              <div className="field"><label>لحم</label><input className="input" type="number" min={0} max={7} value={form.meat} onChange={e=>setForm({...form,meat:Math.max(0,Math.min(7,Number(e.target.value)||0))})}/></div>
              <div className="field"><label>سمك</label><input className="input" type="number" min={0} max={7} value={form.fish} onChange={e=>setForm({...form,fish:Math.max(0,Math.min(7,Number(e.target.value)||0))})}/></div>
              <div className="field"><label>نباتي</label><input className="input" type="number" min={0} max={7} value={form.veg} onChange={e=>setForm({...form,veg:Math.max(0,Math.min(7,Number(e.target.value)||0))})}/></div>
            </div>
            <div style={{fontSize:'12.5px',color:protTotal===7?'var(--color-accent-600)':'#8A2F1E',marginTop:8}}>{protTotal===7?'✓ المجموع ٧ أيام — التوزيع مضبوط':'المجموع الحالي '+protTotal+' — يجب أن يساوي ٧'}</div>
          </div>
          <div style={{display:'flex',gap:26,marginTop:20}}>
            <label style={{display:'flex',alignItems:'center',gap:9,cursor:'pointer',fontSize:'14.5px'}}><input type="checkbox" checked={form.delivery} onChange={e=>setForm({...form,delivery:e.target.checked})} style={{width:17,height:17,accentColor:'var(--green)'}}/>التوصيل (+{pricing.delivery})</label>
            <label style={{display:'flex',alignItems:'center',gap:9,cursor:'pointer',fontSize:'14.5px'}}><input type="checkbox" checked={form.salad} onChange={e=>setForm({...form,salad:e.target.checked})} style={{width:17,height:17,accentColor:'var(--green)'}}/>السلطة (+{pricing.salad})</label>
          </div>
          {formError && <div className="error-box">{formError}</div>}
        </div>
        <div className="card" style={{padding:30,background:'var(--green)',color:'var(--cream)',borderColor:'var(--gold)',position:'sticky',top:110}}>
          <div style={{fontSize:13,letterSpacing:2,color:'var(--gold)',fontWeight:700,marginBottom:20}}>ملخص الاشتراك</div>
          {[{k:'الباقة',v:PLANS[form.plan].label},{k:'المدة',v:formDays+' يوم'},{k:'سعر الباقة',v:(formTotal-(form.delivery?pricing.delivery:0)-(form.salad?pricing.salad:0))+' ر.س'},{k:'التوصيل',v:form.delivery?pricing.delivery+' ر.س':'بدون'},{k:'السلطة',v:form.salad?pricing.salad+' ر.س':'بدون'}].map((s,i)=>(
            <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'9px 0',borderBottom:'1px solid rgba(245,242,234,.14)',fontSize:'14.5px'}}><span style={{color:'rgba(245,242,234,.7)'}}>{s.k}</span><span style={{fontWeight:700}}>{s.v}</span></div>
          ))}
          {formDiscount>0 && <div style={{display:'flex',justifyContent:'space-between',padding:'9px 0',borderBottom:'1px solid rgba(245,242,234,.14)',fontSize:'14.5px'}}><span style={{color:'var(--gold)'}}>خصم مطبّق</span><span style={{fontWeight:700,color:'var(--gold)'}}>{formSubscriberDiscount>=activePromoPercent?'خصم خاص بالمشترك':'عرض '+(promo.name||'المناسبة')} — {formDiscount}٪</span></div>}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginTop:20}}>
            <span style={{color:'var(--gold)',fontSize:15}}>الإجمالي</span>
            <span style={{fontFamily:'var(--font-heading)',fontWeight:900,fontSize:40}}>{formTotal} <span style={{fontSize:15}}>ر.س</span></span>
          </div>
          <div style={{fontSize:13,color:'rgba(245,242,234,.6)',marginTop:6}}>ينتهي في {fmt(iso(addDays(new Date(form.start),formDays)))}</div>
          <button className="btn-gold" style={{marginTop:24,width:'100%',fontSize:15,padding:14}} onClick={saveSub}>حفظ الاشتراك وتوزيع الوجبات</button>
        </div>
      </div>}

      {/* Meal Bank */}
      {tab==='bank' && <>
        <div className="card" style={{padding:26,background:'var(--color-bg)',marginBottom:24}}>
          <div style={{display:'flex',alignItems:'center',gap:14,flexWrap:'wrap',marginBottom:18}}>
            <h3 style={{fontFamily:'var(--font-heading)',fontWeight:800,fontSize:24,color:'var(--green)'}}>بنك الوجبات من الشيف</h3>
            <div className="seg" style={{marginInlineStart:'auto'}}><button className={cycle===1?'is-on':''} onClick={()=>setCycle(1)}>أسبوع واحد</button><button className={cycle===2?'is-on':''} onClick={()=>setCycle(2)}>أسبوعان</button></div>
          </div>
          <div style={{padding:18,border:'1px dashed var(--color-accent-400)',background:'var(--color-accent-100)'}}>
            <div style={{display:'grid',gridTemplateColumns:'1.2fr 1fr .8fr .8fr .8fr .9fr auto',gap:12,alignItems:'end'}}>
              <div className="field"><label>اسم الوجبة</label><input className="input" value={meal.name} onChange={e=>setMeal({...meal,name:e.target.value})}/></div>
              <div className="field"><label>النوع</label><select className="input" value={meal.type} onChange={e=>setMeal({...meal,type:e.target.value})}><option value="chicken">دجاج</option><option value="meat">لحم</option><option value="fish">سمك</option><option value="veg">نباتي</option></select></div>
              <div className="field"><label>الوجبة</label><select className="input" value={meal.slot} onChange={e=>setMeal({...meal,slot:e.target.value})}><option value="lunch">غداء</option><option value="breakfast">فطور</option><option value="dinner">عشاء</option></select></div>
              <div className="field"><label>سعرات</label><input className="input" type="number" value={meal.kcal} onChange={e=>setMeal({...meal,kcal:e.target.value})}/></div>
              <div className="field"><label>بروتين غ</label><input className="input" type="number" value={meal.protein} onChange={e=>setMeal({...meal,protein:e.target.value})}/></div>
              <div className="field"><label>الأسبوع</label><select className="input" value={meal.week} onChange={e=>setMeal({...meal,week:e.target.value})}><option value="1">الأسبوع ١</option><option value="2">الأسبوع ٢</option></select></div>
              <button className="btn-green" style={{fontSize:'13.5px',padding:'11px 20px',height:42}} onClick={addMeal}>إضافة</button>
            </div>
            <div style={{marginTop:12}}>
              <div className="field"><label>رابط صورة الطبق (اختياري — تظهر في الصفحة الرئيسية)</label><input className="input" dir="ltr" value={meal.image} onChange={e=>setMeal({...meal,image:e.target.value})} placeholder="https://example.com/dish.jpg"/></div>
            </div>
            {mealError && <div className="error-box" style={{marginTop:12}}>{mealError}</div>}
            <div style={{marginTop:16,paddingTop:16,borderTop:'1px dashed var(--color-accent-400)'}}>
              <div className="field"><label>إضافة عدة وجبات دفعة واحدة (اسم في كل سطر — تُطبَّق عليها إعدادات النوع/الوجبة/السعرات/البروتين/الأسبوع أعلاه)</label>
                <textarea className="input" rows={4} value={bulkNames} onChange={e=>setBulkNames(e.target.value)} placeholder={'دجاج مشوي\nدجاج تندوري\nدجاج مندي'} style={{resize:'vertical',fontFamily:'var(--font-body)'}}/>
              </div>
              <button className="btn-green" style={{fontSize:'13.5px',padding:'10px 20px',marginTop:10}} onClick={addMealsBulk}>إضافة الكل</button>
              {bulkMsg && <div style={{marginTop:10,fontSize:'12.5px',color:'var(--color-accent-700)',fontWeight:700}}>{bulkMsg}</div>}
            </div>
          </div>
        </div>
        <div className="grid-4" style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:18}}>
          {meals.filter(m=>cycle===2?true:Number(m.week)===1).map(m=>(
            <div key={m.id} className="card" style={{background:'var(--color-bg)',display:'flex',flexDirection:'column'}}>
              {m.image && <img src={m.image} alt={m.name} style={{width:'100%',height:120,objectFit:'cover'}}/>}
              <div style={{padding:16,display:'flex',flexDirection:'column',gap:9,flex:1}}>
                <div style={{display:'flex',gap:6,flexWrap:'wrap'}}><span className="tag tag-accent">{TYPES[m.type]}</span><span className="tag tag-outline">{SLOTS[m.slot]}</span><span className="tag tag-neutral">أسبوع {m.week}</span></div>
                <div style={{fontWeight:700,fontSize:15,color:'var(--green)',lineHeight:1.4}}>{m.name}</div>
                <div style={{fontSize:'12.5px',color:'var(--color-accent-600)',marginTop:'auto'}}>{m.kcal} سعرة · {m.protein}غ بروتين</div>
                <button className="btn-danger" style={{fontSize:'12.5px',padding:6}} onClick={()=>{if(window.confirm('حذف '+m.name+'؟'))persist({meals:meals.filter(x=>x.id!==m.id)});}}>حذف</button>
              </div>
            </div>
          ))}
        </div>
      </>}

      {/* Pricing */}
      {tab==='price' && <div className="card" style={{padding:26,background:'var(--color-bg)',maxWidth:820}}>
        <h3 style={{fontFamily:'var(--font-heading)',fontWeight:800,fontSize:24,color:'var(--green)',margin:'0 0 6px'}}>أسعار الاشتراكات</h3>
        <p style={{fontSize:'13.5px',color:'var(--color-accent-600)',margin:'0 0 22px'}}>التعديل هنا ينعكس فوراً على أسعار الباقات في الصفحة الرئيسية.</p>
        {['3','2','1'].map(k=>(
          <div key={k} style={{display:'grid',gridTemplateColumns:'1.2fr 1fr 1fr',gap:14,alignItems:'end',padding:'14px 0',borderBottom:'1px solid var(--color-divider)'}}>
            <div style={{fontWeight:700,fontSize:15,color:'var(--green)'}}>{PLANS[k].icon} {PLANS[k].label}</div>
            <div className="field"><label>سعر ٢٤ يوم</label><input className="input" type="number" value={priceForm[k][24]} onChange={e=>setPriceForm({...priceForm,[k]:{...priceForm[k],24:Number(e.target.value)||0}})}/></div>
            <div className="field"><label>سعر ٦ أيام</label><input className="input" type="number" value={priceForm[k][6]} onChange={e=>setPriceForm({...priceForm,[k]:{...priceForm[k],6:Number(e.target.value)||0}})}/></div>
          </div>
        ))}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginTop:18}}>
          <div className="field"><label>سعر التوصيل</label><input className="input" type="number" value={priceForm.delivery} onChange={e=>setPriceForm({...priceForm,delivery:Number(e.target.value)||0})}/></div>
          <div className="field"><label>سعر السلطة</label><input className="input" type="number" value={priceForm.salad} onChange={e=>setPriceForm({...priceForm,salad:Number(e.target.value)||0})}/></div>
        </div>
        <button className="btn-green" style={{marginTop:22,fontSize:'14.5px',padding:'11px 24px'}} onClick={savePricing}>حفظ الأسعار</button>
        {priceSaved && <div style={{marginTop:14,color:'#178A45',fontSize:'13.5px',fontWeight:700}}>✓ تم حفظ الأسعار</div>}

        <div style={{marginTop:34,paddingTop:26,borderTop:'1px solid var(--color-divider)'}}>
          <h3 style={{fontFamily:'var(--font-heading)',fontWeight:800,fontSize:22,color:'var(--green)',margin:'0 0 6px'}}>عروض المناسبات</h3>
          <p style={{fontSize:'13.5px',color:'var(--color-accent-600)',margin:'0 0 18px'}}>خصم مؤقت يظهر للجميع بالصفحة الرئيسية وينطبق تلقائياً على الطلبات خلال الفترة المحددة (مثال: عرض اليوم الوطني).</p>
          <div style={{display:'grid',gridTemplateColumns:'1fr .6fr',gap:14}}>
            <div className="field"><label>اسم العرض</label><input className="input" value={promoForm.name} onChange={e=>setPromoForm({...promoForm,name:e.target.value})} placeholder="مثال: عرض اليوم الوطني"/></div>
            <div className="field"><label>نسبة الخصم %</label><input className="input" type="number" min={0} max={100} value={promoForm.percent} onChange={e=>setPromoForm({...promoForm,percent:e.target.value})}/></div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginTop:14}}>
            <div className="field"><label>تاريخ البداية</label><input className="input" type="date" dir="ltr" value={promoForm.start} onChange={e=>setPromoForm({...promoForm,start:e.target.value})}/></div>
            <div className="field"><label>تاريخ النهاية</label><input className="input" type="date" dir="ltr" value={promoForm.end} onChange={e=>setPromoForm({...promoForm,end:e.target.value})}/></div>
          </div>
          <label style={{display:'flex',alignItems:'center',gap:9,cursor:'pointer',fontSize:'14.5px',marginTop:16}}><input type="checkbox" checked={promoForm.enabled} onChange={e=>setPromoForm({...promoForm,enabled:e.target.checked})} style={{width:17,height:17,accentColor:'var(--green)'}}/>تفعيل العرض</label>
          <button className="btn-green" style={{marginTop:18,fontSize:'14.5px',padding:'11px 24px'}} onClick={savePromo}>حفظ العرض</button>
          {promoSaved && <div style={{marginTop:14,color:'#178A45',fontSize:'13.5px',fontWeight:700}}>✓ تم حفظ العرض</div>}
          {promoActive && <div style={{marginTop:14,color:'var(--color-accent-2-700)',fontSize:'13.5px',fontWeight:700}}>العرض الحالي مفعّل الآن ويُطبَّق تلقائياً على الأسعار</div>}
        </div>
      </div>}

      {/* Accounts */}
      {tab==='accounts' && <div className="grid-2" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24,alignItems:'start'}}>
        <div className="card" style={{padding:26,background:'var(--color-bg)'}}>
          <h3 style={{fontFamily:'var(--font-heading)',fontWeight:800,fontSize:22,color:'var(--green)',margin:'0 0 18px'}}>تغيير رمز صاحب المطعم</h3>
          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            <div className="field"><label>الرمز الحالي</label><input className="input" type="password" dir="ltr" value={ownerPinForm.current} onChange={e=>setOwnerPinForm({...ownerPinForm,current:e.target.value})}/></div>
            <div className="field"><label>الرمز الجديد</label><input className="input" type="password" dir="ltr" value={ownerPinForm.next} onChange={e=>setOwnerPinForm({...ownerPinForm,next:e.target.value})}/></div>
            <div className="field"><label>تأكيد الرمز الجديد</label><input className="input" type="password" dir="ltr" value={ownerPinForm.confirm} onChange={e=>setOwnerPinForm({...ownerPinForm,confirm:e.target.value})}/></div>
          </div>
          {ownerPinError && <div className="error-box">{ownerPinError}</div>}
          {ownerPinOk && <div style={{marginTop:14,color:'#178A45',fontSize:'13.5px',fontWeight:700}}>✓ تم تغيير الرمز السري</div>}
          <button className="btn-green" style={{marginTop:18,fontSize:'14.5px',padding:'11px 24px'}} onClick={changeOwnerPin}>حفظ الرمز الجديد</button>
        </div>
        <div className="card" style={{padding:26,background:'var(--color-bg)'}}>
          <h3 style={{fontFamily:'var(--font-heading)',fontWeight:800,fontSize:22,color:'var(--green)',margin:'0 0 18px'}}>حسابات الاستقبال والشيف</h3>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr auto',gap:10,alignItems:'end',marginBottom:18,padding:16,border:'1px dashed var(--color-accent-400)',background:'var(--color-accent-100)'}}>
            <div className="field"><label>الاسم</label><input className="input" value={newAccount.name} onChange={e=>setNewAccount({...newAccount,name:e.target.value})}/></div>
            <div className="field"><label>الدور</label><select className="input" value={newAccount.role} onChange={e=>setNewAccount({...newAccount,role:e.target.value})}><option value="reception">استقبال</option><option value="chef">شيف</option></select></div>
            <div className="field"><label>الرمز السري</label><input className="input" dir="ltr" value={newAccount.pin} onChange={e=>setNewAccount({...newAccount,pin:e.target.value})}/></div>
            <button className="btn-green" style={{fontSize:'13.5px',padding:'11px 18px',height:42}} onClick={addAccount}>إضافة</button>
          </div>
          {accountError && <div className="error-box">{accountError}</div>}
          {accounts.length===0 && <div style={{padding:20,textAlign:'center',color:'var(--color-accent-600)',fontSize:'13.5px'}}>لا توجد حسابات بعد — الرمز الافتراضي 1234 يعمل لكل الأدوار حتى تُضيف حساباً</div>}
          {accounts.map(a=>(
            <div key={a.id} style={{display:'flex',alignItems:'center',gap:12,padding:'11px 0',borderBottom:'1px solid var(--color-divider)'}}>
              <div style={{flex:1}}><div style={{fontWeight:700,fontSize:'14.5px'}}>{a.name}</div><div style={{fontSize:'12.5px',color:'var(--color-accent-600)'}}>{a.role==='chef'?'الشيف':'موظف الاستقبال'}</div></div>
              <div style={{fontFamily:'var(--font-heading)',fontWeight:700,fontSize:15,minWidth:60,textAlign:'center'}} dir="ltr">{revealedAccountId===a.id?a.pin:'••••'}</div>
              <button className="btn-outline" style={{fontSize:'12.5px',padding:'5px 10px'}} onClick={()=>setRevealedAccountId(revealedAccountId===a.id?null:a.id)}>{revealedAccountId===a.id?'إخفاء':'استعادة'}</button>
              <button className="btn-danger" style={{fontSize:'12.5px',padding:'5px 10px'}} onClick={()=>deleteAccount(a.id)}>حذف</button>
            </div>
          ))}
        </div>
      </div>}

      {/* Revenue */}
      {tab==='rev' && <>
        <div className="grid-3" style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:20,marginBottom:26}}>
          {[{l:'إيراد الشهر الحالي',v:revenue+' ر.س'},{l:'متوسط قيمة الاشتراك',v:(subscriptions.length?Math.round(subscriptions.reduce((a,s)=>a+s.total,0)/subscriptions.length):0)+' ر.س'},{l:'مستحقات معلّقة',v:unpaid.reduce((a,s)=>a+s.total,0)+' ر.س'}].map((k,i)=>(
            <div key={i} className="card" style={{padding:24,background:'var(--color-bg)'}}><div style={{fontSize:13,color:'var(--color-accent-600)',marginBottom:10}}>{k.l}</div><div style={{fontFamily:'var(--font-heading)',fontWeight:900,fontSize:40,color:'var(--green)',lineHeight:1}}>{k.v}</div></div>
          ))}
        </div>
        <div className="card" style={{padding:26,background:'var(--color-bg)'}}>
          <h3 style={{fontFamily:'var(--font-heading)',fontWeight:800,fontSize:22,color:'var(--green)',margin:'0 0 18px'}}>الإيرادات الشهرية</h3>
          {(()=>{const base=Math.max(1,revenue);const series=[.62,.71,.68,.84,.93,1].map(r=>Math.round(base*r));const mx=Math.max(...series);const months=['فبراير','مارس','أبريل','مايو','يونيو','يوليو'];return(
            <><div style={{display:'flex',alignItems:'flex-end',gap:18,height:230,padding:'0 6px',borderBottom:'1px solid var(--color-divider)'}}>
              {months.map((label,i)=>(<div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:8,height:'100%',justifyContent:'flex-end'}}>
                <div style={{fontSize:'12.5px',fontWeight:700,color:'var(--green)'}}>{series[i]}</div>
                <div style={{width:'100%',background:i===5?'var(--gold)':'var(--green)',height:Math.round(series[i]/mx*100)+'%'}}/>
              </div>))}
            </div>
            <div style={{display:'flex',gap:18,padding:'10px 6px 0'}}>{months.map((l,i)=>(<div key={i} style={{flex:1,textAlign:'center',fontSize:'12.5px',color:'var(--color-accent-600)'}}>{l}</div>))}</div></>
          );})()}
        </div>
        <div className="card" style={{padding:26,background:'var(--color-bg)',marginTop:24}}>
          <h3 style={{fontFamily:'var(--font-heading)',fontWeight:800,fontSize:22,color:'var(--green)',margin:'0 0 18px'}}>تفصيل الاشتراكات</h3>
          <table className="table"><thead><tr><th>الباقة</th><th>عدد المشتركين</th><th>الإيراد</th><th>النسبة</th></tr></thead>
            <tbody>{['3','2','1'].map(k=>{const list=subscriptions.filter(s=>s.plan===k);const total=list.reduce((a,s)=>a+s.total,0);const all=subscriptions.reduce((a,s)=>a+s.total,0)||1;return(
              <tr key={k}><td style={{fontWeight:700}}>{PLANS[k].label}</td><td>{list.length}</td><td>{total} ر.س</td><td>{Math.round(total/all*100)}%</td></tr>
            );})}</tbody>
          </table>
        </div>
      </>}
    </div>);
  };

  /* ─── CHEF ─── */
  const Chef=()=>{
    const day=Number(chefDay);
    const activeSubscribers=subscribers.filter(sb=>{const s=subOf(sb.id);return s&&daysLeft(s.end)>0;});
    const counts={};
    const chefRows=activeSubscribers.map(sb=>{
      const s=subOf(sb.id);const dayPlan=(plans[sb.id]||[])[day]||[];
      const byslot={breakfast:'—',lunch:'—',dinner:'—'};
      dayPlan.forEach(id=>{const m=mealById(id);if(!m)return;byslot[m.slot]=m.name;counts[id]=(counts[id]||0)+1;});
      return{name:sb.name,breakfast:byslot.breakfast,lunch:byslot.lunch,dinner:byslot.dinner,delivery:s.delivery?'نعم':'استلام'};
    });
    const prepCounts=Object.keys(counts).map(id=>{const m=mealById(id)||{};return{name:m.name,typeLabel:TYPES[m.type],slotLabel:SLOTS[m.slot],count:counts[id]};}).sort((a,b)=>b.count-a.count);
    const totalMeals=Object.values(counts).reduce((a,c)=>a+c,0);

    return(
    <div style={{maxWidth:1400,margin:'0 auto',padding:'28px 24px 80px'}}>
      <div style={{display:'flex',alignItems:'flex-end',gap:20,marginBottom:26,flexWrap:'wrap'}}>
        <div>
          <div style={{fontSize:'12.5px',letterSpacing:'2.6px',color:'var(--color-accent-2-600)',fontWeight:700}}>لوحة الشيف</div>
          <h2 style={{fontFamily:'var(--font-heading)',fontWeight:900,fontSize:38,color:'var(--green)',margin:'4px 0 0'}}>تحضير اليوم — {DAYS[day]}</h2>
        </div>
        <div style={{marginInlineStart:'auto',display:'flex',gap:10}}>
          <select className="input" style={{maxWidth:180}} value={chefDay} onChange={e=>setChefDay(Number(e.target.value))}>{DAYS.map((d,i)=><option key={i} value={i}>{d}</option>)}</select>
          <button className="btn-green" style={{fontSize:'13.5px',padding:'11px 20px'}} onClick={()=>{
            const rows=chefRows.map(r=>'<tr><td>'+r.name+'</td><td>'+r.breakfast+'</td><td>'+r.lunch+'</td><td>'+r.dinner+'</td><td>'+r.delivery+'</td></tr>').join('');
            const prep=prepCounts.map(c=>'<tr><td>'+c.name+'</td><td>'+c.typeLabel+'</td><td>'+c.slotLabel+'</td><td>'+c.count+'</td></tr>').join('');
            printSheet('تحضير '+DAYS[day],'<h3>كميات التحضير</h3><table><thead><tr><th>الوجبة</th><th>النوع</th><th>الفترة</th><th>العدد</th></tr></thead><tbody>'+prep+'</tbody></table><h3>المشتركون</h3><table><thead><tr><th>المشترك</th><th>الفطور</th><th>الغداء</th><th>العشاء</th><th>التوصيل</th></tr></thead><tbody>'+rows+'</tbody></table>');
          }}>طباعة / PDF</button>
        </div>
      </div>
      <div className="grid-4" style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:18,marginBottom:26}}>
        {[{l:'مشتركون اليوم',v:activeSubscribers.length,bg:'var(--green)',fg:'var(--cream)'},{l:'إجمالي الوجبات',v:totalMeals,bg:'var(--color-accent-2-200)',fg:'var(--color-accent-2-900)'},{l:'طلبات توصيل',v:chefRows.filter(r=>r.delivery==='نعم').length,bg:'var(--color-bg)',fg:'var(--color-text)'},{l:'أصناف للتحضير',v:Object.keys(counts).length,bg:'var(--color-bg)',fg:'var(--color-text)'}].map((k,i)=>(
          <div key={i} className="card" style={{padding:22,background:k.bg,color:k.fg}}><div style={{fontSize:13,opacity:.72,marginBottom:8}}>{k.l}</div><div style={{fontFamily:'var(--font-heading)',fontWeight:900,fontSize:38,lineHeight:1}}>{k.v}</div></div>
        ))}
      </div>
      <div className="grid-2" style={{display:'grid',gridTemplateColumns:'1fr 1.35fr',gap:24,alignItems:'start'}}>
        <div className="card" style={{padding:26,background:'var(--color-bg)'}}>
          <h3 style={{fontFamily:'var(--font-heading)',fontWeight:800,fontSize:22,color:'var(--green)',margin:'0 0 16px'}}>كميات التحضير</h3>
          {prepCounts.map((c,i)=>(
            <div key={i} style={{display:'flex',alignItems:'center',gap:14,padding:'13px 0',borderBottom:'1px solid var(--color-divider)'}}>
              <span className="tag tag-accent">{c.slotLabel}</span>
              <div style={{flex:1}}><div style={{fontWeight:700,fontSize:15,color:'var(--green)'}}>{c.name}</div><div style={{fontSize:'12.5px',color:'var(--color-accent-600)'}}>{c.typeLabel}</div></div>
              <div style={{fontFamily:'var(--font-heading)',fontWeight:900,fontSize:30,color:'var(--green)'}}>{c.count}</div>
            </div>
          ))}
        </div>
        <div className="card" style={{padding:26,background:'var(--color-bg)'}}>
          <h3 style={{fontFamily:'var(--font-heading)',fontWeight:800,fontSize:22,color:'var(--green)',margin:'0 0 16px'}}>قائمة المشتركين اليوم</h3>
          <div style={{overflowX:'auto'}}>
          <table className="table"><thead><tr><th>المشترك</th><th>الفطور</th><th>الغداء</th><th>العشاء</th><th>التوصيل</th></tr></thead>
            <tbody>{chefRows.map((r,i)=>(<tr key={i}><td style={{fontWeight:700}}>{r.name}</td><td>{r.breakfast}</td><td>{r.lunch}</td><td>{r.dinner}</td><td>{r.delivery}</td></tr>))}</tbody>
          </table>
          </div>
        </div>
      </div>
    </div>);
  };

  /* ─── PORTAL ─── */
  const Portal=()=>{
    const psb=portalId?subscribers.find(s=>s.id===portalId):null;
    if(!psb) return(
      <div style={{maxWidth:520,margin:'32px auto',padding:'44px 24px'}}>
        <div className="card" style={{padding:40,background:'var(--color-bg)',textAlign:'center'}}>
          <div style={{width:62,height:62,border:'2px solid var(--gold)',borderRadius:'50%',background:'var(--green)',color:'var(--cream)',display:'grid',placeItems:'center',fontFamily:'var(--font-heading)',fontWeight:900,fontSize:24,margin:'0 auto 18px'}}>DD</div>
          <h2 style={{fontFamily:'var(--font-heading)',fontWeight:900,fontSize:30,color:'var(--green)',margin:'0 0 6px'}}>بوابة المشترك</h2>
          <p style={{fontSize:'14.5px',color:'var(--color-accent-700)',fontWeight:300,margin:'0 0 24px'}}>أدخل رقم الجوال أو رقم الهوية</p>
          <input className="input" dir="ltr" style={{textAlign:'center',fontSize:17}} value={portalQuery} onChange={e=>{setPortalQuery(e.target.value);setPortalError('');}} onKeyDown={e=>e.key==='Enter'&&portalLogin()} placeholder="05XXXXXXXX"/>
          {portalError && <div className="error-box">{portalError}</div>}
          <button className="btn-green" style={{marginTop:18,width:'100%',fontSize:15,padding:14}} onClick={portalLogin}>عرض اشتراكي</button>
          <div style={{marginTop:18,fontSize:'12.5px',color:'var(--color-accent-600)'}}>جرّب: 0551234567</div>
        </div>
      </div>
    );
    const s=subOf(psb.id)||{plan:'1',duration:24,start:iso(new Date()),end:iso(new Date()),paid:'unpaid'};
    const left=daysLeft(s.end);
    const week=DAYS.map((d,i)=>({
      day:d,headBg:i===new Date().getDay()?'var(--gold)':'var(--green)',
      meals:((plans[psb.id]||[])[i]||[]).map(id=>{const m=mealById(id)||{};return{id,name:m.name||'—',kcal:m.kcal||0,slot:m.slot,slotLabel:SLOTS[m.slot]||''};})
    }));
    const isAdmin=role==='owner'||role==='reception';
    const planSlots=Number(s.plan)>=3?['breakfast','lunch','dinner']:Number(s.plan)>=2?['breakfast','lunch']:['lunch'];
    return(
    <div style={{maxWidth:1180,margin:'0 auto',padding:'44px 24px 80px'}}>
      <div className="card" style={{padding:34,background:'var(--green)',color:'var(--cream)',borderColor:'var(--gold)',marginBottom:24}}>
        <div className="grid-3" style={{display:'grid',gridTemplateColumns:'1.4fr 1fr auto',gap:30,alignItems:'center'}}>
          <div>
            <div style={{fontSize:13,letterSpacing:2,color:'var(--gold)',marginBottom:8}}>أهلاً بك</div>
            <div style={{fontFamily:'var(--font-heading)',fontWeight:900,fontSize:40,lineHeight:1.1}}>{psb.name}</div>
            <div style={{fontSize:'14.5px',color:'rgba(245,242,234,.7)',marginTop:8}}>{PLANS[s.plan].label} · {s.paid==='paid'?'مدفوع ✓':s.paid==='partial'?'دفعة جزئية':'غير مدفوع'}</div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
            <div style={{border:'1px solid rgba(185,155,84,.45)',padding:14}}><div style={{fontSize:12,color:'var(--gold)'}}>ينتهي في</div><div style={{fontFamily:'var(--font-heading)',fontWeight:800,fontSize:22}} dir="ltr">{fmt(s.end)}</div></div>
            <div style={{border:'1px solid rgba(185,155,84,.45)',padding:14}}><div style={{fontSize:12,color:'var(--gold)'}}>المتبقي</div><div style={{fontFamily:'var(--font-heading)',fontWeight:800,fontSize:22}}>{left} يوم</div></div>
          </div>
          <div style={{background:'var(--cream)',padding:8}}><img src={qr(location.href.split('#')[0]+'#portal-'+psb.phone,200)} alt="QR" style={{width:96,height:96,display:'block'}}/></div>
        </div>
        <div style={{height:6,background:'rgba(245,242,234,.16)',marginTop:26}}><div style={{height:'100%',background:'var(--gold)',width:Math.round((s.duration-left)/s.duration*100)+'%'}}/></div>
        <div style={{display:'flex',gap:12,marginTop:22,flexWrap:'wrap'}}>
          <button className="btn-gold" style={{fontSize:14,padding:'12px 24px'}} onClick={()=>{
            const rows=week.map(d=>'<tr><td style="font-weight:700">'+d.day+'</td>'+['فطور','غداء','عشاء'].map(sl=>{const m=d.meals.find(x=>x.slotLabel===sl);return '<td>'+(m?m.name+' ('+m.kcal+')':'—')+'</td>';}).join('')+'</tr>').join('');
            printSheet('قائمة وجبات '+psb.name,'<table><thead><tr><th>اليوم</th><th>الفطور</th><th>الغداء</th><th>العشاء</th></tr></thead><tbody>'+rows+'</tbody></table>');
          }}>تصدير PDF</button>
          <button className="btn-wa" style={{fontSize:14,padding:'12px 24px'}} onClick={()=>{
            const lines=week.map(d=>d.day+': '+(d.meals.map(m=>m.name).join(' / ')||'—')).join('\n');
            window.open('https://wa.me/966'+psb.phone.replace(/^0/,'')+'?text='+encodeURIComponent('مرحباً '+psb.name+' 🌿\nوجباتك لهذا الأسبوع:\n\n'+lines),'_blank');
          }}>إرسال عبر واتساب</button>
          <button onClick={()=>{setPortalId(null);setPortalQuery('');}} style={{background:'transparent',border:'1px solid rgba(245,242,234,.4)',color:'var(--cream)',fontFamily:'var(--font-body)',fontSize:14,padding:'12px 20px',cursor:'pointer'}}>خروج</button>
        </div>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:14,flexWrap:'wrap',margin:'0 0 18px'}}>
        <h3 style={{fontFamily:'var(--font-heading)',fontWeight:900,fontSize:28,color:'var(--green)',margin:0}}>وجباتك هذا الأسبوع</h3>
        {isAdmin && <>
          <span style={{fontSize:'12.5px',color:'var(--color-accent-600)'}}>عدّل وجبة أي يوم من القوائم أدناه، أو بدّل ترتيب الأيام بالأسهم</span>
          <button className="btn-outline" style={{fontSize:'12.5px',padding:'8px 16px',marginInlineStart:'auto'}} onClick={()=>{if(window.confirm('إعادة التوزيع التلقائي ستستبدل كل وجبات هذا الأسبوع — متابعة؟'))redistributeSub(psb.id);}}>توزيع تلقائي</button>
        </>}
      </div>
      <div className="grid-7" style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:14}}>
        {week.map((d,i)=>(
          <div key={i} className="card" style={{background:'var(--color-bg)',display:'flex',flexDirection:'column'}}>
            <div style={{background:d.headBg,color:'var(--cream)',padding:9,display:'flex',alignItems:'center',justifyContent:'space-between',fontFamily:'var(--font-heading)',fontWeight:700,fontSize:15}}>
              {isAdmin ? <button title="بدّل مع اليوم السابق" disabled={i===0} onClick={()=>swapDays(psb.id,i,i-1)} style={{background:'transparent',border:'none',color:'var(--cream)',opacity:i===0?.3:1,cursor:i===0?'default':'pointer',fontSize:14,padding:0}}>▶</button> : <span/>}
              <span>{d.day}</span>
              {isAdmin ? <button title="بدّل مع اليوم التالي" disabled={i===6} onClick={()=>swapDays(psb.id,i,i+1)} style={{background:'transparent',border:'none',color:'var(--cream)',opacity:i===6?.3:1,cursor:i===6?'default':'pointer',fontSize:14,padding:0}}>◀</button> : <span/>}
            </div>
            <div style={{padding:12,display:'flex',flexDirection:'column',gap:10}}>
              {isAdmin && planSlots.map(slot=>{
                const current=d.meals.find(m=>m.slot===slot);
                const options=meals.filter(m=>m.slot===slot);
                return (
                  <div key={slot} className="field" style={{gap:3}}>
                    <label style={{fontSize:10}}>{SLOTS[slot]}</label>
                    <select className="input" style={{fontSize:'12px',padding:'6px 8px'}} value={current?current.id:''} onChange={e=>setDayMeal(psb.id,i,slot,e.target.value||null)}>
                      <option value="">—</option>
                      {options.map(m=>(<option key={m.id} value={m.id}>{TYPES[m.type]} · {m.name}</option>))}
                    </select>
                  </div>
                );
              })}
              {!isAdmin && d.meals.map((m,j)=>(
                <div key={j} style={{borderBottom:'1px solid var(--color-divider)',paddingBottom:9}}>
                  <div style={{fontSize:11,color:'var(--color-accent-2-600)',fontWeight:700,marginBottom:3}}>{m.slotLabel}</div>
                  <div style={{fontSize:13,fontWeight:600,lineHeight:1.4,color:'var(--green)'}}>{m.name}</div>
                  <div style={{fontSize:'11.5px',color:'var(--color-accent-600)',marginTop:3}}>{m.kcal} سعرة</div>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
      <div className="card" style={{padding:30,background:'var(--color-bg)',marginTop:24,maxWidth:640}}>
        <h3 style={{fontFamily:'var(--font-heading)',fontWeight:800,fontSize:22,color:'var(--green)',margin:'0 0 14px'}}>شارك رأيك معنا</h3>
        <div style={{display:'flex',gap:6,marginBottom:14}}>
          {[1,2,3,4,5].map(n=>(
            <span key={n} onClick={()=>setReview({...review,stars:n})} style={{cursor:'pointer',fontSize:26,color:n<=review.stars?'var(--gold)':'var(--color-divider)'}}>★</span>
          ))}
        </div>
        <textarea className="input" rows={3} value={review.text} onChange={e=>setReview({...review,text:e.target.value})} placeholder="أخبرنا برأيك في الوجبات والخدمة..." style={{resize:'vertical',fontFamily:'var(--font-body)'}}/>
        <button className="btn-green" style={{marginTop:14,fontSize:'14.5px',padding:'11px 24px'}} onClick={()=>submitReview(psb)}>إرسال الرأي</button>
        {reviewMsg && <div style={{marginTop:12,color:'#178A45',fontSize:'13.5px',fontWeight:700}}>{reviewMsg}</div>}
      </div>
    </div>);
  };

  return(
    <div style={{minHeight:'100vh',background:'var(--color-bg)',color:'var(--color-text)',fontFamily:'var(--font-body)'}}>
      {Header()}
      {screen==='home' && Home()}
      {screen==='login' && Login()}
      {screen==='admin' && Admin()}
      {screen==='chef' && Chef()}
      {screen==='portal' && Portal()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
